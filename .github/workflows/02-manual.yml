name: 02 - Manual

on:
  workflow_dispatch:
    inputs:
      logging_level:
        description: 'Nivel de log'
        required: true
        default: 'info'
        type: choice
        options:
          - info
          - debug
          - warn
          - error

      environment:
        description: 'Environment'
        type: environment

      dry_run:
        description: 'Execute without apply changes'
        required: false
        default: false
        type: boolean

      reason:
        description: 'Reason'
        required: false
        default: 'Manual execution'
        type: string

jobs:
  log-the-inputs:
    runs-on: ubuntu-24.04
    steps:
      - name: Display al the logs
        env:
          LOG_LEVEL: ${{ inputs.logging_level }}
          ENVIRONMENT: ${{ inputs.environment }}
          DRY_RUN: ${{ inputs.dry_run }}
          REASON: ${{ inputs.reason }}
        run: |
          echo "LOG_LEVEL: $LOG_LEVEL"
          echo "ENVIRONMENT: $ENVIRONMENT"
          echo "DRY_RUN: $DRY_RUN"
          echo "REASON: $REASON"

      - name: Deploy if there is NO dry-run
        if: ${{ !inputs.dry_run }}
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          echo "Deploying to $ENVIRONMENT environment..."

      - name: Just if LOG is dry-run
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run: no changes applied"
